name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid PR pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      # Stop both legs on the first failure. The two differ only by toolchain,
      # so a failure in one is nearly always a failure in both, and reading the
      # same output twice is not worth the runner minutes.
      fail-fast: true
      matrix:
        # Pinned + latest, so we catch upcoming-toolchain breakage before it
        # lands on users. The two legs resolve to the same release until 1.28
        # ships; that is temporary and self-correcting.
        #
        # This matrix is not decoration. pwrq's --stream path broke on Go 1.27
        # because encoding/json changed which error a truncated document
        # produces, and nothing in the module moved -- exactly the class of
        # break only a "latest toolchain" leg catches.
        go: ["1.27", "1.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          # check-latest is load-bearing for the "1.x" leg, not a nicety.
          # setup-go resolves "1.x" against actions/go-versions, a manifest that
          # lags go.dev by days. With go.mod's floor at 1.27, a stale manifest
          # would resolve "1.x" to a toolchain older than the module requires
          # and the leg would fail before running a single test.
          check-latest: true
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test
        run: go test -race ./...

      # The viz files sit behind a build tag, so the default run never compiles
      # them. gojq's CLI corpus lives in cli/, and it is the test that enforces
      # "any valid jq program produces byte-identical output" -- running it
      # again under -tags viz is what keeps the diagram build from diverging.
      - name: Test (viz build)
        run: go test -race -tags viz ./cli/...

  lint:
    name: lint & vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: gofmt
        run: |
          # testdata is excluded because some of it is deliberately not
          # formatted: cli/testdata/rules checks a rule that only fires on
          # code gofmt would have rewritten, so a fixture there has to keep
          # the parentheses gofmt removes.
          unformatted=$(find . -name '*.go' -not -path '*/testdata/*' -print0 | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: |
          go vet ./...
          go vet -tags viz ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, not "latest": a linter that moves on its own schedule turns
          # a green build red without a change on our side, and the moment that
          # happens is never a convenient one.
          version: v2.13.1

  # pwrq ships to eight Debian architectures through the apt repository, and
  # three of them are 32-bit. Nothing in the ordinary amd64 test run notices
  # that syscall.Timeval's fields are int32 there, so a build that only ever
  # runs on amd64 discovers it at release time instead. This job is that
  # discovery, moved to the pull request.
  #
  # Compile only, no tests: there is no runner for s390x or riscv64, and a
  # build failure is the failure mode this is guarding against.
  cross:
    name: cross-build (release architectures)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: Build every release architecture
        run: |
          set -euo pipefail
          # arch:goarch:extra-env — the same set .goreleaser.yaml builds.
          targets=(
            "amd64:amd64:"
            "arm64:arm64:"
            "armhf:arm:GOARM=7"
            "armel:arm:GOARM=5"
            "i386:386:GO386=softfloat"
            "ppc64el:ppc64le:"
            "riscv64:riscv64:"
            "s390x:s390x:"
          )
          fail=0
          for t in "${targets[@]}"; do
            IFS=: read -r debarch goarch extra <<< "$t"
            for target in ./cmd/pwrq ./cmd/pwrq-viz; do
              tags=""
              [ "$target" = "./cmd/pwrq-viz" ] && tags="-tags viz"
              # shellcheck disable=SC2086
              if env CGO_ENABLED=0 GOOS=linux GOARCH="$goarch" $extra \
                   go build $tags -o /dev/null "$target"; then
                echo "ok    $debarch $target"
              else
                echo "::error::$debarch ($goarch $extra) failed to build $target"
                fail=1
              fi
            done
          done
          exit $fail

  # The editor's browser-side code has its own test suite, and it is not Go.
  web:
    name: web (bun)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Test the editor
        run: make web.test

      # Building the page here is what stops a release discovering a broken
      # wasm or bundler step: .goreleaser.yaml runs `make web.build` as a
      # before-hook, so if it fails the release fails after the tag exists.
      - name: Build the page
        run: make web.build

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  # A release is a bad place to find out the packaging config is wrong, so the
  # whole publishing path runs on every pull request that touches it: build the
  # real artifacts, build the real repository from them with the real script,
  # and have apt actually consume it. The only thing not exercised here is the
  # production signing key, which is replaced by a throwaway one.
  release-dry-run:
    name: release dry run (apt repo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install apt repository tooling
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils

      # cosign and syft are installed here for the same reason the release
      # installs them, and pinned to the same versions. Three separate release
      # failures got past a green CI because this job skipped the stages they
      # broke in: an action ref that did not resolve, a cosign too old to read
      # goreleaser's own signature, and two SBOMs colliding on one filename.
      # None of that is reachable without running the tools.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.6.5"

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: "v1.18.1"

      - name: Build a snapshot release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          # SBOMs run: cataloguing is where the duplicate-name failure showed
          # up, and it costs a couple of minutes. Signing still does not:
          # cosign keyless needs an OIDC identity this job has no business
          # holding. Installing cosign above is still worth it - it is what
          # goreleaser-action uses to verify its own download, which is the
          # step that failed the release twice.
          args: release --snapshot --clean --skip=sign,publish,announce

      - name: Build and verify the apt repository
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          gpg --batch --quick-generate-key --passphrase '' \
              "pwrq ci <ci@example.invalid>" default default never

          mkdir -p "$RUNNER_TEMP/debs"
          cp dist/*.deb "$RUNNER_TEMP/debs/"
          .github/scripts/build-apt-repo.sh "$RUNNER_TEMP/debs" "$RUNNER_TEMP/site"

          # Now consume it as a user would: signature verification on, and a
          # foreign architecture, so this also proves the non-amd64 indices are
          # real rather than merely present.
          A="$RUNNER_TEMP/aptroot"
          mkdir -p "$A"/{etc/apt/sources.list.d,etc/apt/trusted.gpg.d,etc/apt/preferences.d,var/lib/apt/lists/partial,var/cache/apt/archives/partial,var/lib/dpkg}
          touch "$A/var/lib/dpkg/status"
          cp "$RUNNER_TEMP/site/pwrq-archive-keyring.gpg" "$A/etc/apt/trusted.gpg.d/pwrq.gpg"
          echo "deb [signed-by=$A/etc/apt/trusted.gpg.d/pwrq.gpg arch=riscv64] file://$RUNNER_TEMP/site stable main" \
            > "$A/etc/apt/sources.list.d/pwrq.list"
          opts=(-o "Dir=$A" -o "Dir::State=$A/var/lib/apt"
                -o "Dir::State::status=$A/var/lib/dpkg/status"
                -o "Dir::Cache=$A/var/cache/apt"
                -o "Dir::Etc::sourcelist=$A/etc/apt/sources.list.d/pwrq.list"
                -o "Dir::Etc::sourceparts=-"
                -o "Dir::Etc::trusted.gpg.d=$A/etc/apt/trusted.gpg.d"
                -o "APT::Architecture=riscv64")
          apt-get "${opts[@]}" update
          apt-cache "${opts[@]}" policy pwrq pwrq-viz
          cd "$A" && apt-get "${opts[@]}" download pwrq pwrq-viz
          for d in *.deb; do
            echo "--- $d"
            dpkg-deb -f "$d" Package Version Architecture
          done
