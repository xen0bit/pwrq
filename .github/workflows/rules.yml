name: rules

# pwrq ships whatever is on pwrgrep-rules' main, and a Go module is pinned by
# version — so "latest" is something this repository has to go and get. That is
# what this does: bump the pin, prove the corpus still works against this
# engine, and open the change as a pull request.
#
# It is a pull request rather than a push to main because the bump can fail
# honestly. A rule written against a newer cmdlet vocabulary will not compile
# here, and a rule whose language is not in GRAMMARS ships and can never fire.
# Both are caught below, and both should be looked at rather than merged.
#
# The tests run in this job rather than on the pull request, because a pull
# request opened with GITHUB_TOKEN does not start another workflow. What lands
# in the PR body is the run that actually happened.

on:
  # A rules change is usually not urgent, so a daily sweep is enough on its
  # own. The other two triggers are for when it is: workflow_dispatch by hand,
  # and repository_dispatch from pwrgrep-rules if a token is ever set up there.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [rules-updated]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rules-bump
  cancel-in-progress: false

jobs:
  bump:
    name: bump the corpus
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: Bump
        id: bump
        run: |
          set -euo pipefail
          before=$(go list -m -f '{{.Version}}' github.com/xen0bit/pwrgrep-rules)
          GOFLAGS=-mod=mod go get github.com/xen0bit/pwrgrep-rules@main
          go mod tidy
          after=$(go list -m -f '{{.Version}}' github.com/xen0bit/pwrgrep-rules)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          if [ "$before" = "$after" ]; then
            echo "already on $after"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$before -> $after"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The whole suite, not just pkg/pwrgrep. A corpus change reaches further
      # than the package that loads it: rules are named by id in tests
      # elsewhere, and a deduplication that retired two ids broke
      # pkg/udf/pwrgrep/interrupt_test.go while every test in pkg/pwrgrep
      # stayed green. Whatever this costs in runner minutes, it is less than
      # merging that.
      #
      # -race because that is what CI runs here, and the rule cache is shared
      # across a process by design.
      - name: Test
        if: steps.bump.outputs.changed == 'true'
        run: |
          set -euo pipefail
          go build ./...
          go test -race ./...

      - name: Open the pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ steps.bump.outputs.before }}
          AFTER: ${{ steps.bump.outputs.after }}
        run: |
          set -euo pipefail
          branch="rules/bump-$AFTER"

          # A re-run for a version already proposed would collide on the branch
          # name, and there is nothing to add: the open pull request says the
          # same thing.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "$branch already exists; nothing to open"
            exit 0
          fi

          # Written to files rather than passed inline: a multi-line argument
          # inside a YAML block scalar carries the block's indentation into the
          # message.
          cat > /tmp/commit.txt <<EOF
          Take the corpus up to $AFTER

          pwrgrep-rules main moved. The rules compile against this binary's
          cmdlet vocabulary and every language they name is in GRAMMARS, which
          are the two things the corpus repository cannot check for itself.

          $BEFORE -> $AFTER
          EOF
          cat > /tmp/body.md <<EOF
          pwrgrep-rules main moved, so pwrq follows it.

          \`$BEFORE\` -> \`$AFTER\`

          \`go test -race ./...\` passed in the job that opened this, which is where it
          had to run: a pull request opened with \`GITHUB_TOKEN\` does not start another
          workflow. That covers the two checks the corpus repository cannot make for
          itself - every rule compiles against this binary's cmdlet vocabulary, and
          every language a rule names is a grammar the release build carries.

          Opened by \`.github/workflows/rules.yml\`.
          EOF
          # The heredocs are indented to match the block, so take that back off.
          sed -i 's/^          //' /tmp/commit.txt /tmp/body.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add go.mod go.sum
          git commit -F /tmp/commit.txt
          git push -u origin "$branch"
          gh pr create --title "Take the corpus up to $AFTER" --body-file /tmp/body.md
