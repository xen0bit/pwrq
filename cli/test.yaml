- name: empty input
  args:
    - '.'
  input: ''
  expected: ''

- name: empty args
  input: 'null'
  expected: |
    null

- name: simple query
  args:
    - '.foo'
  input: '{"foo": 128}'
  expected: |
    128

- name: array query
  args:
    - '.[]'
  input: '[1, 2, 3]'
  expected: |
    1
    2
    3

- name: object keys
  args:
    - 'keys'
  input: '{"a": 1, "b": 2}'
  expected: |
    [
      "a",
      "b"
    ]

- name: raw output
  args:
    - '-r'
    - '.foo'
  input: '{"foo": "bar"}'
  expected: |
    bar

- name: compact output
  args:
    - '-c'
    - '.'
  input: '{"foo": 128}'
  expected: |
    {"foo":128}

- name: version flag
  args:
    - '-v'
  input: ''
  expected: |
    pwrq 0.1.0 (rev: HEAD/go1.24.2)

- name: help flag
  args:
    - '-h'
  input: ''
  expected: |
    pwrq - Enhanced Go implementation of jq

- name: select_object with pipe and positional property
  args:
    - '.[] | select_object("Name")'
  input: '[{"Name":"Alice","Age":30},{"Name":"Bob","Age":25}]'
  expected: |
    {
      "Name": "Alice"
    }
    {
      "Name": "Bob"
    }

- name: select_object with pipe and multiple positional properties
  args:
    - '.[] | select_object("Name"; "Age")'
  input: '[{"Name":"Alice","Age":30,"City":"NYC"},{"Name":"Bob","Age":25,"City":"LA"}]'
  expected: |
    {
      "Age": 30,
      "Name": "Alice"
    }
    {
      "Age": 25,
      "Name": "Bob"
    }

